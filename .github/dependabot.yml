version: 2

updates:
  # Nothing else moves the commits the workflows pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /raycast
    schedule:
      interval: weekly
      day: monday
    groups:
      raycast:
        patterns:
          - '*'
    commit-message:
      prefix: chore(raycast)
