name: codeql

on:
  pull_request:
    branches:
      - master
  # A pull request's alerts are compared against the default branch's.
  push:
    branches:
      - master
    paths-ignore:
      - .github/**
  schedule:
    - cron: '41 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: xcode-27

    permissions:
      security-events: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: initialize codeql
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      # Between init and analyze, where the tracer watches the compiler; no manifest sandbox, because the tracer's copy of macOS 27's arm64e-only sandbox-exec cannot spawn.
      - name: build
        run: swift build --disable-sandbox

      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
