name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - master
    # Runs when any changed file falls outside this list.
    paths-ignore:
      - .github/**
      - README.md
      # The Raycast extension ships through the Raycast store, not the app's release.
      - raycast/**
  workflow_dispatch:
    inputs:
      version:
        description: version to release, without the leading v (e.g. 0.3.0)
        required: true

concurrency:
  # One group for all releases: concurrent merges would race for one version.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.pull_request.merged
              && !contains(github.event.pull_request.title, '[skip-release]')) }}
    runs-on: macos-26

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.dist.outputs.sha256 }}

    steps:
      # Deep for the tag history the version comes from; ref pins to what merged.
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: work out the version
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            major="${major#v}"
            # Anchored: feat:/feat(x):/feat!: takes the minor, anything else a patch.
            if printf '%s' "$TITLE" | grep -qiE '^feat[(!:]'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
          fi
          echo "releasing $version (previous tag: ${latest:-none})"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TITLE: ${{ github.event.pull_request.title }}

      - name: report toolchain
        run: swift --version

      - name: test
        run: swift test

      - name: check for the signing secrets
        run: |
          missing=
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_KEY_P8 APPLE_KEY_ID APPLE_ISSUER_ID; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || {
            echo "unset repository secrets:$missing"
            echo "Without them the build cannot be signed with the Developer ID, and an unsigned"
            echo "release is one Gatekeeper refuses. See README.md, Releasing."
            exit 1
          }
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}

      # A keychain of its own, so the private key never touches the runner's login keychain.
      - name: import the signing certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          # No idle or sleep lock: codesign runs minutes later, on a keychain nothing can unlock.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Without a partition list, codesign's first use of the key blocks on a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          # Prepended rather than replacing: find-identity only searches the list.
          security list-keychains -d user | tr -d '"' \
            | xargs security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: build, sign and notarize the release archive
        id: dist
        run: |
          printf '%s' "$APPLE_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          make dist VERSION="$VERSION" \
            NOTARY_KEY="$RUNNER_TEMP/notary.p8" \
            NOTARY_KEY_ID="$APPLE_KEY_ID" \
            NOTARY_ISSUER="$APPLE_ISSUER_ID"
          zip=".build/dist/Heed-$VERSION.zip"
          {
            echo "sha256=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)"
            echo "zip=$zip"
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}

      # `make notarize` only warns when it skips, and an unsigned release is worse than none.
      - name: check the archive is notarized
        run: xcrun stapler validate ".build/stage/Heed.app"

      - name: publish the release
        run: |
          # Immutable releases: attach the archive while draft, publish once complete.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --generate-notes --draft "$ZIP"
          elif [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            echo "$TAG is already published, and immutable releases means its assets can no"
            echo "longer change. Re-run this workflow by hand with a version that is not taken."
            exit 1
          fi
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          ZIP: ${{ steps.dist.outputs.zip }}

      - name: forget the signing key
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

  cask:
    needs: build
    runs-on: ubuntu-latest

    # Nothing here touches this repo; the tap bump uses its own token.
    permissions: {}

    steps:
      - name: check for the tap token
        run: |
          [ -n "$TAP_TOKEN" ] || {
            echo "TAP_TOKEN is unset. Add a fine-grained PAT with Contents: write on"
            echo "rbstp/homebrew-tap as a repository secret, or the checkout below just 404s."
            exit 1
          }
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

      - name: checkout the tap
        uses: actions/checkout@v7
        with:
          repository: rbstp/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: point the cask at the new release
        run: |
          sed -i \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Casks/heed.rb
          # A sed matching nothing exits 0 and would silently keep the old version.
          for expected in "  version \"$VERSION\"" "  sha256 \"$SHA256\""; do
            grep -qxF "$expected" Casks/heed.rb || {
              echo "Casks/heed.rb has no line matching: $expected"
              exit 1
            }
          done
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}

      - name: commit
        run: |
          if git diff --quiet Casks/heed.rb; then
            echo "the tap already points at $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "heed $VERSION" Casks/heed.rb
          git push
        env:
          VERSION: ${{ needs.build.outputs.version }}
