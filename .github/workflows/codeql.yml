name: codeql

on:
  pull_request:
    branches:
      - master
  # A pull request's alerts are compared against the default branch's.
  push:
    branches:
      - master
  schedule:
    - cron: '41 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: xcode-27

    permissions:
      security-events: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: initialize codeql
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: swift
          build-mode: manual

      # Between init and analyze on purpose: CodeQL extracts Swift by watching the
      # compiler, so a build outside that window produces nothing.
      - name: build
        run: swift build

      - name: analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:swift
