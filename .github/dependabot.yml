version: 2

updates:
  # The workflows pin actions to a commit, which is what Scorecard's
  # Pinned-Dependencies check asks for; without this nothing would ever move
  # those commits forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One pull request for all of them: they move together and none of it ships.
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /raycast
    schedule:
      interval: weekly
      day: monday
    groups:
      raycast:
        patterns:
          - '*'
    commit-message:
      prefix: chore(raycast)
