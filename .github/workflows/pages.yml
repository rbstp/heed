name: pages

# The project site at heed.rbstp.dev. Static files in site/, no build step: the
# workflow uploads the directory as it is, the way rbstp.dev deploys its dist/.
on:
  push:
    branches:
      - master
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# One deployment at a time, and never cancel one in flight: a half-finished
# Pages deployment leaves the site on whichever version it was on.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
